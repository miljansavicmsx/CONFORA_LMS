name: Backend tests (full)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'

jobs:
  nest-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build API dependencies
        run: pnpm exec turbo build --filter=@confora/api

      - name: Nest API unit tests
        run: pnpm --filter @confora/api test

      - name: Public health contract
        run: pnpm --filter @confora/api test:compliance

      # OD-2026-10-20: FastAPI backend/ pytest is a tracked gap.
