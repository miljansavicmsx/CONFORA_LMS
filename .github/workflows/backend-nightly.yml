name: Backend tests (full)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Deployment env validation (dry-run)
        working-directory: .
        run: python scripts/validate_deployment_env.py
      - name: Full suite (unit + integration + slow / e2e)
        run: python -m pytest -q --tb=short --durations=30
