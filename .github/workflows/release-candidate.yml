name: Release Candidate

on:
  workflow_dispatch:

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install workspace
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Nest API tests and build
        run: |
          pnpm exec turbo build --filter=@confora/api
          pnpm --filter @confora/api test

      - name: Frontend cutover validation
        run: node scripts/ops/run-f4-8g-frontend-validation.mjs

      # OD-2026-10-20: FastAPI pytest and frontend-app `tsc -b && vite build`
      # are tracked gaps. This dispatch job does not pretend either passed.
