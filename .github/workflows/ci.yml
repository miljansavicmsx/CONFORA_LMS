name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: API e2e (auth + verify)
        run: pnpm --filter @confora/api exec jest --config ./jest-e2e.config.cjs --runInBand

      - name: PAdES / pdfcpu signature smoke
        if: runner.os == 'Linux'
        env:
          CI_PDF_SIGNING: '1'
          CERT_SIGNING_P12_PATH: /tmp/confora-ci-signer.p12
          CERT_SIGNING_P12_PASSWORD: confora-test
        run: |
          set -eux
          sudo apt-get update -y
          sudo apt-get install -y openssl
          curl -fsSL "https://github.com/pdfcpu/pdfcpu/releases/download/v0.11.0/pdfcpu_0.11.0_Linux_x86_64.tar.gz" | tar xz
          sudo mv pdfcpu*/pdfcpu /usr/local/bin/
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/confora-ci-key.pem -out /tmp/confora-ci-cert.pem -days 365 -subj "/CN=CONFORA Test Issuing CA/O=CONFORA"
          openssl pkcs12 -export -out "$CERT_SIGNING_P12_PATH" -inkey /tmp/confora-ci-key.pem -in /tmp/confora-ci-cert.pem -passout pass:"$CERT_SIGNING_P12_PASSWORD"
          cd apps/api && pnpm exec jest pdf-pades.sign --runInBand

      - name: Build
        env:
          DISABLE_ERD: 'true'
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: confora
          POSTGRES_PASSWORD: confora_dev_change_me
          POSTGRES_DB: confora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confora -d confora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
          DISABLE_ERD: 'true'
        run: pnpm exec prisma generate

      - name: Prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
        run: pnpm exec prisma migrate deploy

      - name: Prisma seed
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
        run: pnpm run seed

      - name: Database tests
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
        run: pnpm run test

      - name: A11y risk register compliance (RISK-A11Y-001)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
        run: pnpm exec jest --config ./jest.compliance.config.cjs gov/risks/risks.compliance.spec.ts --runInBand

  docker:
    runs-on: ubuntu-latest
    needs: [quality, database]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: confora/api:ci

      - name: Build Web image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: confora/web:ci

      - name: Build Admin image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.admin
          push: false
          tags: confora/admin:ci
