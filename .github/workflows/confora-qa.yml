name: CONFORA QA (API + compliance)

on:
  workflow_dispatch:
    inputs:
      zap_target:
        description: "Public URL for OWASP ZAP baseline (optional)"
        required: false
        default: ""

jobs:
  unit-and-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @confora/database run generate
      - name: API unit tests
        run: pnpm --filter @confora/api test
      - name: API compliance suite
        run: pnpm --filter @confora/api test:compliance
      - name: Worker tests
        run: pnpm --filter @confora/worker test

  zap-baseline:
    if: ${{ github.event.inputs.zap_target != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@1e1871e84428617b969d4a1f981a8255630d54b0 # v0.10.0
        with:
          target: ${{ github.event.inputs.zap_target }}
