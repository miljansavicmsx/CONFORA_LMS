name: Accessibility CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly accessibility regression (Faza 92 R-H2)
    - cron: "0 3 * * *"

concurrency:
  group: a11y-ci-${{ github.ref }}
  cancel-in-progress: true

# R0-7S1 / R0-7D2: contents read only — no commit/push; artifacts only (no PR comments).
permissions:
  contents: read

env:
  # Shared local URLs for compliance-iso Playwright gates (not production).
  PLAYWRIGHT_APP_URL: http://127.0.0.1:5173
  PLAYWRIGHT_API_URL: http://127.0.0.1:8000
  PLAYWRIGHT_PUBLIC_URL: http://127.0.0.1:3000
  VITE_API_URL: http://127.0.0.1:8000

jobs:
  compliance-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: confora
          POSTGRES_PASSWORD: confora_dev_change_me
          POSTGRES_DB: confora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confora -d confora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
      INTEGRATION_DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
      PLAYWRIGHT_NEST_API_URL: http://127.0.0.1:4000
      PLAYWRIGHT_WEB_URL: http://127.0.0.1:3000
      PLAYWRIGHT_APP_URL: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:4000
      AUTH_JWT_MODE: hs256
      AUTH_JWT_HS256_SECRET: e2e-test-hs256-secret-min-32-characters!!
      KEYCLOAK_ISSUER: http://keycloak.test/realms/confora
      E2E_EXAM_SANDBOX: "1"
      API_PORT: "4000"
      DISABLE_ERD: "true"
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Prisma generate, migrate, seed
        working-directory: packages/database
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm run seed

      - name: Build Nest API and frontends (Nest as VITE_API_URL)
        env:
          VITE_API_URL: http://127.0.0.1:4000
        run: |
          pnpm --filter @confora/api build
          pnpm --filter @confora/web build
          cd frontend-app && npm ci && npm run build

      - name: Start Nest API (exam sandbox + public routes)
        run: (cd apps/api && node dist/main.js &)

      - name: Wait for API ready
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4000/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Start frontends (production mode)
        run: |
          (cd frontend-app && NODE_ENV=production npm exec vite preview -- --host 127.0.0.1 --port 5173 &)
          (cd apps/web && pnpm start &)
          npx wait-on@8.0.1 \
            http://127.0.0.1:5173 \
            http://127.0.0.1:3000 \
            http://127.0.0.1:4000/openapi \
            -t 180000

      - name: Install e2e deps
        working-directory: tests/e2e
        run: npm ci

      - name: Playwright browser
        working-directory: tests/e2e
        run: npx playwright install chromium --with-deps

      - name: ISO §B–§F — Playwright compliance gates
        working-directory: tests/e2e
        run: |
          npx playwright test \
            compliance/iso17024_3_22_equitable_access.spec.ts \
            compliance/iso17024_7_2_2_public_scheme_information_a11y.spec.ts \
            compliance/iso17024_9_1_4_fair_valid_reliable_a11y.spec.ts \
            compliance/iso17024_9_1_5_accommodation_workflow.spec.ts \
            compliance/iso17024_9_2_2_e_accommodation_at_application.spec.ts \
            --reporter=line

      - name: API — §3.22 artefacts + §7.2.2 integration
        working-directory: apps/api
        run: |
          pnpm exec jest --config ./jest.compliance.config.cjs \
            iso17024_3_22_fairness_artifacts --runInBand
          pnpm exec jest --config ./jest.integration.config.cjs \
            scheme-public-722 --runInBand

  # R0-7D2: frontend-app-only accessibility baseline (PLAN_C stage 1).
  # Does not repair compliance-iso, Prisma, packages/database, or design-token contrast.
  accessibility:
    runs-on: ubuntu-latest
    # R0-7D2R: approved maximum job timeout is 15 minutes.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-app
    env:
      PLAYWRIGHT_A11Y_BASELINE: "1"
      PLAYWRIGHT_NO_WEB_SERVER: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      A11Y_REPORT_DIR: ${{ github.workspace }}/frontend-app/test-results/accessibility
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install frontend-app (frozen lockfile)
        run: npm ci

      - name: Build frontend-app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start vite preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 2
          done
          echo "preview failed to become ready"
          exit 1

      - name: Browser axe WCAG_2_2_AA_AUTOMATED_SUBSET (public routes)
        run: npx playwright test --config=playwright.config.ts

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-frontend-app-baseline
          path: |
            frontend-app/test-results/
            frontend-app/playwright-report/
          retention-days: 14
          if-no-files-found: warn

      # R0-7S1 / R0-7D2: repository mutation forbidden. Artifacts only.
      # No PR comments. No untracked scripts/a11y or tools/a11y references.
