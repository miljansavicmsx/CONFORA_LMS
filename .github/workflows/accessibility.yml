name: Accessibility CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly accessibility regression (Faza 92 R-H2)
    - cron: '0 3 * * *'

concurrency:
  group: a11y-ci-${{ github.ref }}
  cancel-in-progress: true

# R0-7S1: contents must remain read — no commit/push of repository content.
permissions:
  contents: read
  pull-requests: write

env:
  REPORTS_DIR: tests/e2e/reports
  PLAYWRIGHT_APP_URL: http://127.0.0.1:5173
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
  PLAYWRIGHT_NO_WEB_SERVER: '1'
  VITE_API_URL: http://127.0.0.1:4000

jobs:
  compliance-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: confora
          POSTGRES_PASSWORD: confora_dev_change_me
          POSTGRES_DB: confora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confora -d confora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://confora:confora_dev_change_me@127.0.0.1:5432/confora
      OIDC_ISSUER_URL: http://keycloak.test/realms/confora
      OIDC_CLIENT_ID: confora-ci
      API_PORT: '4000'
      DISABLE_ERD: 'true'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Prisma generate, migrate, seed
        working-directory: packages/database
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm run seed

      - name: Build Nest API
        run: pnpm exec turbo build --filter=@confora/api

      - name: Start Nest API
        run: (cd apps/api && node dist/main.js &)

      - name: Wait for API ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4000/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Nest API did not serve GET /v1/health"
          exit 1

      - name: Unauthenticated staff report stays closed
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:4000/v1/staff/reports/certification-applications/by-status)"
          echo "status ${code}"
          test "${code}" = "401"

      - name: Public health contract
        run: pnpm --filter @confora/api test:compliance

      # OD-2026-10-20 tracked gaps, not empty passes:
      # iso17024 Playwright specs, iso17024_3_22_fairness_artifacts,
      # scheme-public-722, @confora/web, apps/web.

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Design token contrast (WCAG 1.4.3 / 1.4.11)
        run: pnpm a11y:contrast

      - name: Build Vite frontend (public routes)
        env:
          PLAYWRIGHT_F4_SMOKE: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: |
          pnpm --filter @confora/ui build
          pnpm --filter @confora/i18n build
          pnpm --filter confora-frontend-app exec vite build

      - name: Install Playwright Chromium
        run: pnpm --filter confora-frontend-app exec playwright install chromium --with-deps

      - name: Start Vite preview
        run: |
          set -euo pipefail
          mkdir -p "$REPORTS_DIR"
          (cd frontend-app && pnpm exec vite preview --host 127.0.0.1 --port 5173 &)
          npx wait-on@8.0.1 http://127.0.0.1:5173/login -t 120000

      - name: Axe — public Vite routes
        working-directory: frontend-app
        run: pnpm exec playwright test e2e/a11y-public-axe.spec.ts --reporter=line

      - name: T4 — Lighthouse accessibility gate
        run: |
          chrome="$(find "${HOME}/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux*/chrome' | head -n 1)"
          if [ -z "${chrome}" ]; then
            echo "Playwright Chromium was not installed"
            exit 1
          fi
          CHROME_PATH="${chrome}" node scripts/a11y/run-lighthouse.mjs

      - name: Compare axe vs baseline
        if: always()
        run: node scripts/a11y/compare-baseline.mjs

      - name: Aggregate HTML report + coverage gate
        if: always()
        run: node scripts/a11y/aggregate-report.mjs

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-report
          path: |
            tests/e2e/reports/
            frontend-app/playwright-report/
          retention-days: 14

      - name: PR comment summary
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/a11y/pr-comment.mjs

      - name: Notify on failure (#a11y + champion)
        if: failure()
        env:
          SLACK_A11Y_WEBHOOK_URL: ${{ secrets.SLACK_A11Y_WEBHOOK_URL }}
          A11Y_CHAMPION_EMAIL: ${{ secrets.A11Y_CHAMPION_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: node scripts/a11y/notify-failure.mjs

      # R0-7S1: repository mutation removed. Reports ship via upload-artifact only.
      # Do not reintroduce repository write-back without a new owner decision.

      - name: Record a11y CI outcome (compliance.ci_pipeline_runs)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.COMPLIANCE_DATABASE_URL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB_STATUS: ${{ job.status }}
          A11Y_CI_CONCLUSION: ${{ job.status }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "COMPLIANCE_DATABASE_URL not configured — skip CI ingest"
            exit 0
          fi
          cd packages/database && pnpm exec prisma generate
          node ../../scripts/record-a11y-ci-run.mjs
