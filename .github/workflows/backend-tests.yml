name: Backend tests

on:
  push:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  nest-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Nest API unit tests
        run: pnpm --filter @confora/api test

      # OD-2026-10-20: FastAPI backend/ pytest is a tracked gap.
