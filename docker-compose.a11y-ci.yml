# CI stack for accessibility pipeline (T1 + T4 + T5).
# Backend + DynamoDB; frontends run on the host in production mode after build.
# Usage: docker compose -f docker-compose.a11y-ci.yml up -d

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,ses
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-central-1

  fastapi-backend:
    image: python:3.12-slim
    working_dir: /workspace/backend
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_ENDPOINT_URL_S3: http://localstack:4566
      S3_BUCKET_UPLOADS: moj-test-bucket
      ENVIRONMENT: test
      DEV_LOCAL_AUTH: "true"
      DEV_LOCAL_JWT_SECRET: confora-a11y-ci-secret-key-min16
      DEV_LOCAL_PASSWORD: devlocal123
      DEV_LOCAL_SKIP_DYNAMODB: "false"
      COGNITO_USER_POOL_ID: ""
      COGNITO_CLIENT_ID: ""
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command:
      - sh
      - -c
      - |
        set -e
        cd /workspace/backend
        pip install --no-cache-dir --root-user-action=ignore -r requirements.txt
        i=0
        while [ "$$i" -lt 90 ]; do
          if python -c "import socket; s=socket.socket(); s.settimeout(2); s.connect(('dynamodb-local',8000)); s.close()" 2>/dev/null; then break; fi
          i=$$((i + 1)); sleep 1
        done
        i=0
        while [ "$$i" -lt 120 ]; do
          if python -c "import urllib.request; urllib.request.urlopen('http://localstack:4566/_localstack/health', timeout=3)" 2>/dev/null; then break; fi
          i=$$((i + 1)); sleep 1
        done
        AWS_ENDPOINT_URL_DYNAMODB=http://dynamodb-local:8000 \
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
          python /workspace/scripts/create_dynamodb_tables.py
        exec uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - dynamodb-local
      - localstack
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
